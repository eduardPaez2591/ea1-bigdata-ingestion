name: Big Data EA1 Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

jobs:
  ingestion-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Permite leer el contenido del repositorio
      actions: write # Permite ejecutar acciones

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # Mejora el rendimiento al almacenar en caché las dependencias de pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el pipeline de ingestión
        run: |
          python src/ingestion.ipynb

      - name: Subir Archivos Como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ingested-data
          path: |
            src/datos_api/ingestion.db
            src/exchange_rates/exchange_rates.csv
            src/static/auditoria/auditoria.txt
